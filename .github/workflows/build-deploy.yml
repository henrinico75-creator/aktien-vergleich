name: build-deploy

# Baut die Website und veroeffentlicht sie auf GitHub Pages.
# Voraussetzung: In den Repo-Einstellungen unter Pages als Quelle
# "GitHub Actions" waehlen. Optional zwei Repository-Variablen setzen
# (Settings -> Secrets and variables -> Actions -> Variables):
#   SITE_BASE_URL     z. B. https://USER.github.io/aktien-vergleich
#   SITE_PATH_PREFIX  z. B. aktien-vergleich  (Repo-Name bei Project Pages)

on:
  schedule:
    - cron: "30 5 * * *"   # taeglich 05:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest
      - name: Daten holen (Netzfehler tolerieren)
        run: python -m src.fetch || true
      - name: Seite bauen
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          SITE_PATH_PREFIX: ${{ vars.SITE_PATH_PREFIX }}
        run: python -m src.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
