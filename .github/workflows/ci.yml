name: ci

# Tests und ein Build zur Probe. Kein Deploy: die Veroeffentlichung macht
# Vercel (Repo dort verbunden, Build aus vercel.json).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest
      - name: Build zur Probe (ohne Netzdaten)
        run: python -m src.build
