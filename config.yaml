# Zentrale Konfiguration für den Seitengenerator.

site_name: "Orderkosten"
tagline: "Wo kaufe ich welche Aktie am günstigsten?"

# Vollständige URL für sitemap.xml und canonical. Auf Vercel über die
# Umgebungsvariable SITE_BASE_URL setzen, sobald die Domain verbunden ist.
# Der Wert hier ist nur der lokale Vorgabewert.
base_url: "https://orderkosten.de"

# Pfad-Prefix für Links und Assets INNERHALB der Seiten. Vercel liefert von
# der Domain-Wurzel aus, daher leer. Nur für einen Betrieb unter einem
# Unterpfad über SITE_PATH_PREFIX setzen.
path_prefix: ""

# Ordervolumina (EUR), für die die Kostentabelle je Aktie gerendert wird.
default_order_sizes: [250, 1000, 5000]

# Impressum-Kurzangabe für den Footer. Vollständiges Impressum in content/.
owner_name: "Nico Bücher"

# Anzeigehinweis: solange true, blendet jede Seite den Prototyp-Banner ein.
prototype_banner: true
