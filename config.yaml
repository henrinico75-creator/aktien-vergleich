# Zentrale Konfiguration für den Seitengenerator.

site_name: "Aktien-Kosten"
tagline: "Wo kaufe ich welche Aktie am günstigsten?"

# Vollständige URL für sitemap.xml und canonical. Vor Launch anpassen oder
# über Umgebungsvariable SITE_BASE_URL setzen (z. B. in GitHub Actions).
base_url: "https://USER.github.io/aktien-vergleich"

# Pfad-Prefix für Links und Assets INNERHALB der Seiten. Lokal leer lassen,
# damit "python -m http.server -d dist" funktioniert. Auf GitHub Project Pages
# den Repo-Namen setzen (z. B. aktien-vergleich) oder SITE_PATH_PREFIX nutzen.
path_prefix: ""

# Ordervolumina (EUR), für die die Kostentabelle je Aktie gerendert wird.
default_order_sizes: [250, 1000, 5000]

# Impressum-Kurzangabe für den Footer. Vollständiges Impressum in content/.
owner_name: "Nico Bücher"

# Anzeigehinweis: solange true, blendet jede Seite den Prototyp-Banner ein.
prototype_banner: true
