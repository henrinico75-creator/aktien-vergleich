# handgepflegt und grob nach Stand Anfang 2026. Vor einer Veröffentlichung
# jede Zeile gegen KIID bzw. Factsheet des Anbieters prüfen. Kurse und
# Fondsvolumen holt der Datenlauf über den Ticker.
#
# Felder:
#   slug            URL-Segment /etf/<slug>/, eindeutig
#   name            Anzeigename
#   ticker          Yahoo-Finance-Symbol (meist Xetra, Suffix .DE)
#   wkn / isin      Kennungen
#   currency        Handelswährung der genannten Notiz
#   ter             Gesamtkostenquote in Prozent pro Jahr
#   index           abgebildeter Index
#   replication     physisch voll | physisch optimiert | Sampling | synthetisch
#   distribution    thesaurierend | ausschüttend
#   domicile        Fondsdomizil
#   note            kurze Einordnung

