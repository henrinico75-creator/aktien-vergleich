# Gebührenmodelle je Broker. Handgepflegt.
#
# WICHTIG: Die Werte sind Startwerte mit grobem Stand Anfang 2026 und müssen
# vor einer Veröffentlichung Zeile für Zeile gegen das Preis- und
# Leistungsverzeichnis des jeweiligen Anbieters geprüft werden. Danach
# quartalsweise nachziehen und feld `fee_basis` mit Datum aktualisieren.
#
# Felder:
#   id                 stabiler Slug, wird zur URL /broker/<id>/
#   name               Anzeigename
#   venue              typischer Handelsplatz für diese Konditionen
#   order_fixed        feste Ordergebühr in EUR (Einmalkauf)
#   order_pct          variabler Anteil vom Ordervolumen (0.0025 = 0,25 %)
#   order_min          Untergrenze der Gesamt-Ordergebühr in EUR (0 = keine)
#   order_max          Obergrenze in EUR (null = keine)
#   free_above         ab diesem Ordervolumen 0 EUR (null = nie)
#   savings_plan_fixed feste Gebühr je Sparplanausführung in EUR
#   savings_plan_pct   variabler Anteil je Sparplanausführung
#   subscription_eur   monatliches Abo in EUR (0 = keins)
#   affiliate_url      echter Partnerlink, erst nach Programm-Aufnahme; sonst null
#   note               kurze Einordnung für die Tabelle
#   fee_basis          Quelle und Stand der Zahlen

