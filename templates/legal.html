{% extends "base.html" %}
{% block title %}{{ title }} | {{ cfg.site_name }}{% endblock %}
{% block description %}{{ title }} von {{ cfg.site_name }}.{% endblock %}
{% block canonical %}<link rel="canonical" href="{{ cfg.base_url }}/{{ slug }}/">{% endblock %}

{% block content %}
<article class="prose">
  <h1>{{ title }}</h1>
  {{ body|safe }}
</article>
{% endblock %}
